name: Release

# Pushing a tag vX.Y.Z builds mneva and publishes it to PyPI through trusted
# publishing (OIDC): PyPI trusts this workflow file in this repository, so no
# API token is stored anywhere. The PyPI side is configured once under the
# project's Publishing settings: owner mneva-ai, repository mneva, workflow
# release.yml, environment pypi.
#
# workflow_dispatch runs the build and checks only, so the workflow can be
# exercised without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/mneva/__init__.py').read_text(encoding='utf-8')).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
      - name: Build
        # twine 7 or newer: hatchling emits metadata 2.5, which twine 6 rejects.
        run: |
          python -m pip install build "twine>=7"
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
