[pytest]
testpaths = tests
addopts = -ra -q --strict-markers
markers =
    integration: end-to-end tests touching the filesystem and HTTP server
asyncio_mode = auto
# Dump every thread's stack if a single test exceeds this. A hang used to show
# up in CI as a job that ran for hours and then got cancelled with no output at
# all; this turns that into an actual traceback pointing at the stuck call.
faulthandler_timeout = 120
