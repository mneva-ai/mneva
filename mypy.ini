[mypy]
python_version = 3.11
strict = True
files = src/mneva
warn_unused_ignores = True
no_implicit_reexport = True

[mypy-sqlite_vec]
ignore_missing_imports = True

[mypy-rank_bm25]
ignore_missing_imports = True

# numpy arrives transitively via rank-bm25; we never touch it directly.
# It ships py.typed stubs, so mypy follows them, and recent numpy releases
# write PEP 695 `type X = ...` in those stubs. With python_version pinned to
# 3.11 above, mypy rejects that syntax and aborts before checking any of our
# code ("Type statement is only supported in Python 3.12 and greater").
# Because latest numpy dropped Python 3.11, only the 3.12 CI cells resolve a
# stub new enough to trigger it.
# follow_imports_for_stubs is required: follow_imports alone does not apply
# to .pyi files, which is exactly where the offending syntax lives.
[mypy-numpy]
follow_imports = skip
follow_imports_for_stubs = True

[mypy-numpy.*]
follow_imports = skip
follow_imports_for_stubs = True

[mypy-frontmatter]
ignore_missing_imports = True
